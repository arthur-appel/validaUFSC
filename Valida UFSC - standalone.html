  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 scale (1920×1080) */\n    --type-hero: 104px;\n    --type-title: 64px;\n    --type-subtitle: 42px;\n    --type-body: 32px;\n    --type-small: 26px;\n    --type-tiny: 24px;\n    --type-mono: 24px;\n    /* Spacing */\n    --pad-x: 100px;\n    --pad-top: 84px;\n    --pad-bottom: 92px;\n    --gap-title: 44px;\n    --gap-item: 24px;\n    /* Brand */\n    --brand: #3b6fe0;\n    --brand-600: #2f5bc4;\n    --brand-700: #274ba3;\n    --brand-50: #eef4ff;\n    --brand-100: #d9e6ff;\n    --emerald: #10b981;\n    --emerald-50: #ecfdf5;\n    --sky: #0ea5e9;\n    --sky-50: #f0f9ff;\n    --amber: #f59e0b;\n    --amber-50: #fffbeb;\n    --rose: #f43f5e;\n    --rose-50: #fff1f3;\n    /* Slate neutrals */\n    --s900: #0f172a;\n    --s800: #1e293b;\n    --s700: #334155;\n    --s600: #475569;\n    --s500: #64748b;\n    --s400: #94a3b8;\n    --s300: #cbd5e1;\n    --s200: #e2e8f0;\n    --s100: #f1f5f9;\n    --bg: #f8fafc;\n    --card: #ffffff;\n    --border: #e6ebf2;\n    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);\n    --shadow-lg: 0 2px 4px rgba(15,23,42,.04), 0 18px 50px rgba(15,23,42,.10);\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: #0b1220; }\n  deck-stage:not(:defined) { visibility: hidden; }\n\n  section {\n    font-family: 'Inter', system-ui, sans-serif;\n    background: var(--bg);\n    color: var(--s800);\n    overflow: hidden;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ---------- Shared layout ---------- */\n  .frame {\n    position: absolute; inset: 0;\n    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);\n    display: flex; flex-direction: column;\n  }\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 12px;\n    font-size: var(--type-small); font-weight: 700; letter-spacing: .04em;\n    text-transform: uppercase; color: var(--brand);\n  }\n  .eyebrow::before {\n    content: \"\"; width: 34px; height: 3px; border-radius: 2px; background: var(--brand);\n  }\n  h1.title {\n    font-size: var(--type-title); font-weight: 800; line-height: 1.04;\n    letter-spacing: -.02em; color: var(--s900); margin: 18px 0 0;\n    text-wrap: balance; max-width: 1500px;\n  }\n  .lead {\n    font-size: var(--type-subtitle); font-weight: 500; line-height: 1.28;\n    color: var(--s600); margin: 22px 0 0; max-width: 1320px; text-wrap: pretty;\n  }\n  .slidenum {\n    position: absolute; right: var(--pad-x); bottom: 44px;\n    font-size: var(--type-tiny); font-weight: 600; color: var(--s400);\n    letter-spacing: .02em;\n  }\n  .kicker-foot {\n    position: absolute; left: var(--pad-x); bottom: 44px;\n    font-size: var(--type-tiny); font-weight: 600; color: var(--s400);\n    display: flex; align-items: center; gap: 12px;\n  }\n  .logo {\n    display: inline-grid; place-items: center;\n    background: var(--brand); color: #fff; font-weight: 800;\n    border-radius: 14px; box-shadow: 0 6px 16px rgba(59,111,224,.35);\n  }\n\n  /* ---------- Cards ---------- */\n  .card {\n    background: var(--card); border: 1px solid var(--border);\n    border-radius: 20px; box-shadow: var(--shadow);\n  }\n  .pad { padding: 34px 36px; }\n\n  /* ---------- Chips / badges ---------- */\n  .chip {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-size: var(--type-tiny); font-weight: 700; padding: 9px 16px;\n    border-radius: 999px; line-height: 1; white-space: nowrap;\n  }\n  .chip-emerald { background: var(--emerald-50); color: #047857; }\n  .chip-sky { background: var(--sky-50); color: #0369a1; }\n  .chip-amber { background: var(--amber-50); color: #b45309; }\n  .chip-rose { background: var(--rose-50); color: #be123c; }\n  .chip-brand { background: var(--brand-50); color: var(--brand-700); }\n  .chip-slate { background: var(--s100); color: var(--s600); }\n  .dot { width: 12px; height: 12px; border-radius: 50%; }\n\n  .mono { font-family: 'JetBrains Mono', monospace; }\n  .codepill {\n    font-family: 'JetBrains Mono', monospace; font-size: var(--type-tiny);\n    background: var(--s900); color: #e2e8f0; padding: 6px 12px;\n    border-radius: 9px; font-weight: 500; white-space: nowrap;\n  }\n\n  /* ---------- Title (blue) slide ---------- */\n  .blue { background: var(--brand); color: #fff; }\n  .blue .frame { padding: 96px var(--pad-x); }\n\n  /* ---------- Bullets ---------- */\n  ul.bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--gap-item); }\n  ul.bullets > li {\n    display: grid; grid-template-columns: 30px 1fr; gap: 20px; align-items: start;\n    font-size: var(--type-body); line-height: 1.32; color: var(--s700);\n  }\n  ul.bullets > li .bdot {\n    margin-top: 12px; width: 12px; height: 12px; border-radius: 50%;\n    background: var(--brand); flex: none;\n  }\n  ul.bullets > li b { color: var(--s900); font-weight: 700; }\n\n  .bignum { font-size: 88px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: var(--brand); }\n  .statlabel { font-size: var(--type-small); font-weight: 600; color: var(--s500); margin-top: 12px; }\n\n  svg.ico { width: 28px; height: 28px; stroke-width: 1.9; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  svg.ico-lg { width: 38px; height: 38px; stroke-width: 1.8; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n\n  /* Entrance animations intentionally omitted: content is always visible so\n     print, PDF export, captures and live view render reliably. */\n  .anim, .anim2, .anim3 { opacity: 1; }\n</style>\n</head>\n<body>\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- ===================== 01 — CAPA ===================== -->\n  <section data-label=\"Capa\" class=\"blue\">\n    <div class=\"frame\" style=\"justify-content:center;\">\n      <div class=\"logo anim\" style=\"width:108px;height:108px;font-size:64px;background:#fff;color:var(--brand);box-shadow:0 12px 40px rgba(0,0,0,.25);\">V</div>\n      <h1 class=\"anim2\" style=\"font-size:var(--type-hero);font-weight:900;letter-spacing:-.03em;line-height:1.0;color:#fff;margin:40px 0 0;max-width:1500px;\">Valida UFSC</h1>\n      <p class=\"anim2\" style=\"font-size:var(--type-subtitle);font-weight:600;color:#dbe6ff;margin:20px 0 0;\">Auditor de Equivalências de Currículos da UFSC</p>\n      <p class=\"anim3\" style=\"font-size:var(--type-body);color:#bcd0ff;margin:14px 0 0;max-width:1180px;\">Aproveitamento de disciplinas com pipeline de dados + IA local</p>\n      <div class=\"anim3\" style=\"margin-top:56px;display:flex;gap:48px;align-items:flex-end;flex-wrap:wrap;\">\n        <div>\n          <div style=\"font-size:var(--type-tiny);color:#9ec0ff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;\">Autores</div>\n          <div style=\"font-size:var(--type-small);color:#fff;font-weight:600;margin-top:8px;\">[Nome do autor] · [Nome do autor] · [Nome do autor]</div>\n        </div>\n        <div style=\"width:1px;height:58px;background:rgba(255,255,255,.25);\"></div>\n        <div>\n          <div style=\"font-size:var(--type-tiny);color:#9ec0ff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;\">Disciplina</div>\n          <div style=\"font-size:var(--type-small);color:#fff;font-weight:600;margin-top:8px;\">Ciência e Engenharia de Dados</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== 02 — O PROBLEMA ===================== -->\n  <section data-label=\"O problema\">\n    <div class=\"frame\">\n      <div class=\"eyebrow anim\">O problema</div>\n      <h1 class=\"title anim\">Comparar dois currículos, matéria por matéria, na mão</h1>\n      <div style=\"display:grid;grid-template-columns:1.05fr .95fr;gap:48px;margin-top:var(--gap-title);align-items:start;flex:1;\">\n        <ul class=\"bullets anim2\" style=\"align-self:center;\">\n          <li><span class=\"bdot\"></span><div>Um aluno que quer <b>mudar de curso</b> ou aproveitar disciplinas precisa abrir <b>dois PDFs de currículo</b> e cruzá-los linha a linha.</div></li>\n          <li><span class=\"bdot\" style=\"background:var(--amber);\"></span><div>São <b>dezenas de disciplinas</b> e <b>ementas longas</b> — um trabalho lento, cansativo e fácil de errar.</div></li>\n          <li><span class=\"bdot\" style=\"background:var(--rose);\"></span><div>Sem ferramenta, a triagem inicial vira um gargalo antes mesmo de chegar ao colegiado.</div></li>\n        </ul>\n        <div class=\"card anim3\" style=\"overflow:hidden;align-self:center;\">\n          <div style=\"padding:20px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;color:var(--s500);font-weight:600;font-size:var(--type-small);\">\n            <svg class=\"ico\" viewBox=\"0 0 24 24\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><path d=\"M14 2v6h6\"></path></svg>\n            curriculo_origem.pdf · curriculo_destino.pdf\n          </div>\n          <div style=\"padding:26px 28px;display:flex;flex-direction:column;gap:13px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;\"><span class=\"mono\" style=\"font-size:var(--type-tiny);color:var(--s700);\">INE5111 · Estruturas de Dados</span><span class=\"chip chip-slate\">72h</span></div>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;\"><span class=\"mono\" style=\"font-size:var(--type-tiny);color:var(--s700);\">MTM3110 · Cálculo I</span><span class=\"chip chip-slate\">90h</span></div>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;\"><span class=\"mono\" style=\"font-size:var(--type-tiny);color:var(--s700);\">INE5403 · Fund. Matemática</span><span class=\"chip chip-slate\">72h</span></div>\n            <div style=\"height:1px;background:var(--border);margin:4px 0;\"></div>\n            <div style=\"color:var(--s400);font-size:var(--type-tiny);font-style:italic;\">…+ 47 disciplin SC</div>\n    <div class=\"slidenum\">11</div>\n  </section>\n\n  <!-- ===================== 12 — PILAR 2 / MOTOR ===================== -->\n  <section data-label=\"Pilar 2 — O motor\">\n    <div class=\"frame\">\n      <div style=\"display:flex;align-items:center;gap:16px;\" class=\"anim\">\n        <span class=\"chip\" style=\"font-size:var(--type-small);background:var(--sky);color:#fff;\">PILAR 2</span>\n        <span class=\"eyebrow\" style=\"margin:0;\">O motor de equivalência</span>\n      </div>\n      <h1 class=\"title anim\">Quatro camadas, em ordem de confiança</h1>\n      <div style=\"display:grid;grid-template-columns:1.25fr .85fr;gap:44px;margin-top:36px;flex:1;align-items:center;\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;\" class=\"anim2\">\n          <div class=\"ladder\"><span class=\"ladnum\" style=\"background:var(--emerald);\">1</span><div><b>Código exato</b><span>Mesmo código → equivalência certa</span></div><span class=\"chip chip-emerald\">determinístico</span></div>\n          <div class=\"ladder\"><span class=\"ladnum\" style=\"background:var(--emerald);\">2</span><div><b>Equivalência oficial</b><span>Tabela da própria UFSC</span></div><span class=\"chip chip-emerald\">determinístico</span></div>\n          <div class=\"ladder\"><span class=\"ladnum\" style=\"background:var(--sky);\">3</span><div><b>Semântico</b><span>Embeddings comparam ementas</span></div><span class=\"chip chip-sky\">IA</span></div>\n          <div class=\"ladder\"><span class=\"ladnum\" style=\"background:var(--sky);\">4</span><div><b>Somatório N:1</b><span>Soma disciplinas para cobrir uma</span></div><span class=\"chip chip-sky\">IA</span></div>\n        </div>\n        <div style=\"display:flex;flex-direction:column;gap:22px;\" class=\"anim3\">\n          <div style=\"font-size:var(--type-small);font-weight:700;color:var(--s500);\">A saída chega em duas faixas:</div>\n          <div class=\"card pad\" style=\"border-color:#bbe9d4;background:va , deixando a equivalência 100% baseada no casamento de códigos, equivalências oficiais e comparação de embeddings semânticos rápidos via Ollama.</p>\n      </div>\n    </div>\n    <div class=\"kicker-foot\"><span class=\"logo\" style=\"width:30px;height:30px;font-size:17px;\">V</span>Valida UFSC</div>\n    <div class=\"slidenum\">15</div>\n  </section>\n\n  <!-- ===================== 16 — DECISÃO #4 / RECALL ===================== -->\n  <section data-label=\"Decisão #4\">\n    <div class=\"frame\">\n      <div style=\"display:flex;align-items:center;gap:16px;\" class=\"anim\">\n        <span class=\"chip\" style=\"font-size:var(--type-small);background:var(--rose);color:#fff;\">DECISÃO DIFÍCIL #4</span>\n        <span class=\"eyebrow\" style=\"margin:0;color:var(--rose);\">Recall + a regra dos 75%</span>\n      </div>\n      <h1 class=\"title anim\">Triador de recall, mas a CH de 75% é inegociável</h1>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:var(--gap-title);flex:1;align-items:center;\">\n        <ul class=\"bullets anim2\">\n          <li><span class=\"bdot\" style=\"background:var(--sky);\"></span><div>Reposicionamos como <b>triador de recall</b>: mostrar o maior leque possível — o colegiado decide.</div></li>\n          <li><span class=\"bdot\" style=\"background:var(--rose);\"></span><div>Mas a <b>CH de 75% é obrigatória</b>: um isolado abaixo disso que <b>não dá para somar</b> é recusa certa → fica fora.</div></li>\n          <li><span class=\"bdot\" style=\"background:var(--emerald);\"></span><div>Ligamos o <b>somatório N:1 na faixa semântica</b>, com reuso da mesma origem para maximizar o leque.</div></li>\n        </ul>\n        <div class=\"card anim3\" style=\"overflow:hidden;\">\n          <div style=\"padding:18px 28px;background:var(--emerald-50);color:#047857;font-weight:700;font-size:var(--type-small);\">Somatório que cobre o destino</div>\n          <div class=\"pad\" style=\"display:flex;align-items:center; ;\">Boas chances</div></div>\n            </div>\n            <div style=\"border:1px dashed var(--s300);border-radius:14px;flex:1;display:flex;align-items:center;justify-content:center;color:var(--s400);font-size:var(--type-small);min-height:150px;gap:12px;\">\n              <svg class=\"ico\" viewBox=\"0 0 24 24\" style=\"color:var(--s300);\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"></rect><path d=\"M3 9h18M9 9v12\"></path></svg>\n              Tabela em 2 faixas · visualização da soma · upload de histórico\n            </div>\n          </div>\n        </div>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\" class=\"anim3\">\n          <div style=\"font-size:var(--type-small);font-weight:700;color:var(--s500);\">Engenharia por baixo</div>\n          <div class=\"card\" style=\"padding:18px 22px;display:flex;align-items:center;gap:16px;\"><svg class=\"ico\" viewBox=\"0 0 24 24\" style=\"color:var(--emerald);flex:none;\"><path d=\"m9 12 2 2 4-4\"></path><circle cx=\"12\" cy=\"12\" r=\"9\"></circle></svg><div style=\"font-size:var(--type-small);color:var(--s700);\"><b style=\"color:var(--s900)\">25 testes</b> · motor offline (teste offline)</div></div>\n          <div class=\"card\" style=\"padding:18px 22px;display:flex;align-items:center;gap:16px;\"><svg class=\"ico\" viewBox=\"0 0 24 24\" style=\"color:var(--brand);flex:none;\"><path d=\"M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"></path><path d=\"m3.3 7 8.7 5 8.7-5\"></path></svg><div style=\"font-size:var(--type-small);color:var(--s700);\"><b style=\"color:var(--s900)\">Docker Compose</b> + seed (dados de teste)</div></div>\n          <div class=\"card\" style=\"padding:18px 22px;display:flex;align-items:center;gap:16px;\"><svg class=\"ico\" viewBox=\"0 0 24 24\" style=\"color:var(--sky);flex:none;\"><path d=\"M12 3v18M3 7.5 12 3l9 4.5\"></path><path d=\"M3 7.5v9L12 21l9-4.5v-9\"></path></svg><div style=\"font-size:var(--type-small);color:var(--s700);\"><code class=\"mono\">git clone</code> rápido · cache versionado</div></div>\n        </div>\n      </div>\n    </div>\n    <div class=\"kicker-foot\"><span class=\"logo\" style=\"width:30px;height:30px;font-size:17px;\">V</span>Valida UFSC</div>\n    <div class=\"slidenum\">18</div>\n  </section>\n\n  <!-- ===================== 19 — RESULTADOS & FUTURO ===================== -->\n  \n  <!-- ===================== 18b — LIMITAÇÕES & DESAFIOS ===================== -->\n  <section data-label=\"Limitações & Desafios\">\n    <div class=\"frame\">\n      <div style=\"display:flex;align-items:center;gap:16px;\" class=\"anim\">\n        <span class=\"chip\" style=\"font-size:var(--type-small);background:var(--amber);color:#000;\">LIMITAÇÕES</span>\n        <span class=\"eyebrow\" style=\"margin:0;color:var(--amber);\">Onde estão os gargalos</span>\n      </div>\n      <h1 class=\"title anim\">Ferramenta auxiliar de triagem, não oráculo milagroso</h1>\n      <div style=\"display:grid;grid-template-columns:1.05fr .95fr;gap:48px;margin-top:var(--gap-title);flex:1;align-items:center;\">\n        <ul class=\"bullets anim2\">\n          <li><span class=\"bdot\" style=\"background:var(--amber);\"></span><div><b>Mais chances, menos certezas:</b> O app serve como um acelerador e solucionador de dores, mas a validação oficial é sempre decisão humana do colegiado.</div></li>\n          <li><span class=\"bdot\" style=\"background:var(--rose);\"></span><div><b>A parte mais difícil:</b> Parsing do PDF de ementas. As coordenadas no pdfplumber foram cruciais porque o layout varia e vigências em branco de 2027 geram dados nulos.</div></li>\n          <li><span class=\"bdot\" style=\"background:var(--emerald);\"></span><div><b>Confiança em 0,75:</b> Aumentamos de 0,70 para 0,75 após notar alucinações (falsos positivos) nas faixas próximas a 0,72.</div></li>\n        </ul>\n        <div class=\"card pad anim3\" style=\"background:var(--amber-50);border-color:#fde4b0;\">\n          <div style=\"font-size:32px;font-weight:800;color:#b45309;\">Atenção com a Ementa</div>\n          <p style=\"font-size:var(--type-small);color:var(--s700);margin-top:14px;line-height:1.45;\">O motor aproxima ementas pela proximidade de termos no embedding. Não substitui a leitura de ementas peculiares pelo professor, mas afunila 90% do trabalho.</p>\n        </div>\n      </div>\n    </div>\n    <div class=\"kicker-foot\"><span class=\"logo\" style=\"width:30px;height:30px;font-size:17px;\">V</span>Valida UFSC</div>\n    <div class=\"slidenum\">18b</div>\n  </section>\n\n  <!-- ===================== 18c — INICIALIZAÇÃO DO SISTEMA ===================== -->\n  <section data-label=\"Inicialização (Seed)\">\n    <div class=\"frame\">\n      <div style=\"display:flex;align-items:center;gap:16px;\" class=\"anim\">\n        <span class=\"chip\" style=\"font-size:var(--type-small);background:var(--sky);color:#fff;\">SETUP</span>\n        <span class=\"eyebrow\" style=\"margin:0;color:var(--sky);\">Modos de Inicialização</span>\n      </div>\n      <h1 class=\"title anim\">Sobe em segundos com Seed, ou reconstrói do zero</h1>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:var(--gap-title);flex:1;align-items:center;\">\n        <div class=\"card pad anim2\" style=\"border-color:#cfe0ff;background:var(--brand-50);\">\n          <div class=\"chip chip-brand\" style=\"font-size:var(--type-small);\">Modo Padrão · Com Seed</div>\n          <div style=\"font-size:38px;font-weight:800;color:var(--brand-700);margin-top:18px;line-height:1.15;\">Pronto para rodar na hora</div>\n          <p style=\"font-size:var(--type-small);color:var(--s700);margin:16px 0 0;line-height:1.45;\">\n            O banco PostgreSQL já inicia pré-populado com os dados extraídos, embeddings computados e 3.794 equivalências. Basta rodar <code>docker compose up</code> e usar de imediato.\n          </p>\n        </div>\n        <div class=\"card pad anim3\" style=\"border-color:#e2e8f0;\">\n          <div class=\"chip chip-slate\" style=\"font-size:var(--type-small);\">Modo Completo · Sem Seed</div>\n          <div style=\"font-size:38px;font-weight:800;color:var(--s900);margin-top:18px;line-height:1.15;\">Computar tudo do zero</div>\n          <p style=\"font-size:var(--type-small);color:var(--s700);margin:16px 0 0;line-height:1.45;\">\n            Executa todo o pipeline nativamente: Scraping do CAGR (Playwright) → Parsing dos PDFs (pdfplumber) → Embeddings no Ollama. Leva horas e exige alto processamento de CPU.\n          </p>\n        </div>\n      </div>\n    </div>\n    <div class=\"kicker-foot\"><span class=\"logo\" style=\"width:30px;height:30px;font-size:17px;\">V</span>Valida UFSC</div>\n    <div class=\"slidenum\">18c</div>\n  </section>\n\n  <section data-label=\"Resultados &amp; futuro\">\n    <div class=\"frame blue\" style=\"position:absolute;\">\n      <div style=\"position:absolute;inset:0;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;\">\n        <div class=\"eyebrow anim\" style=\"color:#bcd0ff;\">Resultados &amp; futuro</div>\n        <h1 class=\"title anim\" style=\"color:#fff;\">O que entregamos — e para onde vai</h1>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px;\" class=\"anim2\">\n          <div style=\"background:rgba(255,255,255,.1);border-radius:18px;padding:26px 28px;\"><div style=\"font-size:60px;font-weight:900;color:#fff;line-height:1;\">~109</div><div style=\"font-size:var(--type-tiny);color:#bcd0ff;margin-top:8px;\">cursos</div></div>\n          <div style=\"background:rgba(255,255,255,.1);border-radius:18px;padding:26px 28px;\"><div style=\"font-size:60px;font-weight:900;color:#fff;line-height:1;\">~6,2k</div><div style=\"font-size:var(--type-tiny);color:#bcd0ff;margin-top:8px;\">disciplinas</div></div>\n          <div style=\"background:rgba(255,255,255,.1);border-radius:18px;padding:26px 28px;\"><div style=\"font-size:60px;font-weight:900;color:#fff;line-height:1;\">3.794</div><div style=\"font-size:var(--type-tiny);color:#bcd0ff;margin-top:8px;\">equivalências</div></div>\n          <div style=\"background:#fff;border-radius:18px;padding:26px 28px;\"><div style=\"font-size:60px;font-weight:900;color:var(--brand);line-height:1;\">82,6%</div><div style=\"font-size:var(--type-tiny);color:var(--s500);margin-top:8px;\">Comp. → Sist. de Inf.</div></div>\n        </div>\n        <div style=\"margin-top:44px;\" class=\"anim3\">\n          <div style=\"font-size:var(--type-small);font-weight:700;color:#bcd0ff;letter-spacing:.04em;text-transform:uppercase;\">Futuro</div>\n          <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;\">\n            <span class=\"chip\" style=\"background:rgba(255,255,255,.14);color:#fff;font-size:var(--type-small);\">Formulário pré-preenchido</span>\n            <span class=\"chip\" style=\"background:rgba(255,255,255,.14);color:#fff;font-size:var(--type-small);\">Dark mode</span>\n            <span class=\"chip\" style=\"background:rgba(255,255,255,.14);color:#fff;font-size:var(--type-small);\">Abrir currículo em PDF</span>\n            <span class=\"chip\" style=\"background:rgba(255,255,255,.14);color:#fff;font-size:var(--type-small);\">Deploy público &amp; suporte a outros campi</span>\n          </div>\n        </div>\n        <div style=\"margin-top:auto;display:flex;align-items:center;gap:18px;\" class=\"anim3\">\n          <div class=\"logo\" style=\"width:52px;height:52px;font-size:30px;background:#fff;color:var(--brand);\">V</div>\n          <div style=\"font-size:var(--type-subtitle);font-weight:800;color:#fff;\">Obrigado!</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n</deck-stage>\n\n<style>\n  /* Flow diagram boxes (slide 06) */\n  .flowbox {\n    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;\n    padding: 18px 22px; font-size: var(--type-small); font-weight: 800; color: var(--s900);\n    text-align: center; line-height: 1.15; min-width: 150px; box-shadow: var(--shadow); flex: 1;\n  }\n  .flowbox span { display: block; font-size: var(--type-tiny); font-weight: 600; color: var(--s500); margin-top: 5px; }\n  .flowbox-db { background: var(--brand-50); border-color: #bcd0ff; color: var(--brand-700); }\n  .flowbox-db span { color: var(--brand); }\n  .flowbox-app { border-color: #cfe0ff; }\n  .flowarrow { font-size: 34px; font-weight: 800; color: var(--s300); flex: none; }\n  /* Stack rows (slide 07) */\n  .stackrow { display: flex; align-items: center; gap: 22px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 28px; box-shadow: var(--shadow); }\n  .stackico { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; flex: none; }\n  .stacktitle { font-size: 30px; font-weight: 800; color: var(--s900); }\n  .stackdesc { font-size: var(--type-small); color: var(--s600); margin-top: 4px; }\n  /* Ladder (slide 12) */\n  .ladder { display: flex; align-items: center; gap: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 24px; box-shadow: var(--shadow); }\n  .ladder > div { flex: 1; }\n  .ladder b { display: block; font-size: 30px; font-weight: 800; color: var(--s900); }\n  .ladder span:not(.ladnum):not(.chip) { display: block; font-size: var(--type-tiny); color: var(--s500); margin-top: 3px; }\n  .ladnum { width: 50px; height: 50px; border-radius: 12px; color: #fff; font-weight: 900; font-size: 26px; display: grid; place-items: center; flex: none; }\n</style>\n<script src=\"bdccae39-495e-42d2-b273-a5daae0f69fd\"><\/script>\n\n\n</body></html>"
