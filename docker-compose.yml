services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valida}
      POSTGRES_DB: ${POSTGRES_DB:-valida_ufsc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valida} -d ${POSTGRES_DB:-valida_ufsc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      # processa requisições de embedding concorrentes
      OLLAMA_NUM_PARALLEL: "4"
      # mantém o modelo de embeddings carregado em memória
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Job one-shot: baixa o modelo de embeddings. Rode: docker compose run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${EMBEDDING_MODEL:-bge-m3}"
    profiles: ["setup"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://valida:valida@db:5432/valida_ufsc}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn valida_ufsc.api.main:app --host 0.0.0.0 --port 8000"

  # Job one-shot do pipeline de dados (scraping -> parsing -> load -> embeddings).
  # Rode: docker compose run --rm etl
  etl:
    build:
      context: ./backend
      dockerfile: Dockerfile.etl
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://valida:valida@db:5432/valida_ufsc}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["python", "-m", "valida_ufsc.etl.pipeline"]
    profiles: ["etl"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama:
